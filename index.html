<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Voicemail for Pat</title>
    <style>
        body {
            background-color: #021431; 
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #04214f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 20px;
            box-sizing: border-box;
        }
        img.logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        h1 {
            color: #f28224; 
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #00a8e1; 
            font-size: 1.1em;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button, .upload-btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: opacity 0.2s;
            box-sizing: border-box;
            text-decoration: none;
        }
        button:active, .upload-btn:active {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #recordBtn { background-color: #f28224; color: white; }
        .upload-btn { background-color: #00a8e1; color: #021431; }
        #stopBtn { background-color: #ffc000; color: #021431; }
        #submitBtn { background-color: #f28224; color: white; width: 100%; margin: 10px 0; }
        #discardBtn { background-color: #666; color: white; width: 100%; margin: 10px 0; }
        
        #status { margin-top: 20px; font-weight: bold; color: #00a8e1; min-height: 24px; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .recording-indicator {
            color: #ffc000; 
            font-weight: bold; 
            animation: pulse 1.5s infinite; 
            margin-bottom: 15px; 
            font-size: 1.2em;
        }
    </style>
</head>

    <h1>Leave a voicemail for Pat!</h1>
    <p class="subtitle">Record a message or upload an audio file.</p>
    
    <input type="text" id="userName" placeholder="Your Name (Optional)" />
    
    <!-- Phase 1: Action Selection -->
    <div id="actionArea">
        <button id="recordBtn">Record Message</button>
        <p style="margin: 10px 0; font-weight: bold; color: #ccc;">or</p>
        <label for="fileUpload" class="upload-btn">Upload Audio File</label>
        <input type="file" id="fileUpload" accept="audio/*" style="display: none;" />
    </div>
    
    <!-- Phase 2: Active Recording -->
    <div id="recordingArea" style="display: none;">
        <p class="recording-indicator">Recording... Speak now.</p>
        <button id="stopBtn">Stop Recording</button>
    </div>
    
    <!-- Phase 3: Review & Submit -->
    <div id="reviewArea" style="display: none;">
        <audio id="audioPlayback" controls style="width: 100%; margin-bottom: 15px;"></audio>
        <button id="submitBtn">Submit Voicemail</button>
        <button id="discardBtn">Discard and Start Over</button>
    </div>
    
    <p id="status">Ready to record or upload.</p>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxZNyiH5YTwng_zDvkk0xeV6Xe0T6-BJMa7KtxNQ7ngPT9csHDympvJkeSTePgjwM4FnA/exec";
    const hiddenSecretKey = "TEST_SECRET_KEY";
    
    let mediaRecorder;
    let audioChunks = [];
    let wakeLock = null;
    let finalPayloadData = null; 
    let finalMimeType = null;
    
    const actionArea = document.getElementById('actionArea');
    const recordingArea = document.getElementById('recordingArea');
    const reviewArea = document.getElementById('reviewArea');
    
    const recordBtn = document.getElementById('recordBtn');
    const fileUpload = document.getElementById('fileUpload');
    const stopBtn = document.getElementById('stopBtn');
    const submitBtn = document.getElementById('submitBtn');
    const discardBtn = document.getElementById('discardBtn');
    
    const statusText = document.getElementById('status');
    const userNameInput = document.getElementById('userName');
    const audioPlayback = document.getElementById('audioPlayback');

    function canSubmit() {
        const lastSub = localStorage.getItem('lastVoicemailTime');
        if (lastSub && (Date.now() - lastSub < 300000)) {
            return false;
        }
        return true;
    }

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log("Wake Lock error:", err);
        }
    }

    async function releaseWakeLock() {
        if (wakeLock !== null) {
            await wakeLock.release();
            wakeLock = null;
        }
    }

    function resetUI() {
        actionArea.style.display = 'block';
        recordingArea.style.display = 'none';
        reviewArea.style.display = 'none';
        statusText.innerText = "Ready to record or upload.";
        statusText.style.color = "#00a8e1";
        finalPayloadData = null;
        finalMimeType = null;
        audioPlayback.src = "";
        fileUpload.value = "";
    }

    recordBtn.addEventListener('click', async () => {
        if (!canSubmit()) {
            statusText.innerText = "Please wait a few minutes before submitting another voicemail.";
            statusText.style.color = "red";
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = prepareReview;

            mediaRecorder.start();
            await requestWakeLock();
            
            actionArea.style.display = 'none';
            recordingArea.style.display = 'block';
            statusText.innerText = "";
        } catch (err) {
            statusText.innerText = "Microphone access denied or unavailable.";
            statusText.style.color = "red";
            console.error("Mic error:", err);
        }
    });

    stopBtn.addEventListener('click', async () => {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop()); 
        await releaseWakeLock();
        
        recordingArea.style.display = 'none';
        statusText.innerText = "Processing audio...";
        statusText.style.color = "#00a8e1";
    });

    function prepareReview() {
        finalMimeType = mediaRecorder.mimeType.split(';')[0];
        const audioBlob = new Blob(audioChunks, { type: finalMimeType });
        
        if (audioBlob.size > 10485760) {
            statusText.innerText = "Error: Recording is too long (over 10MB). Please record a shorter message.";
            statusText.style.color = "red";
            resetUI();
            return;
        }

        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
            finalPayloadData = reader.result;
            audioPlayback.src = finalPayloadData;
            reviewArea.style.display = 'block';
            statusText.innerText = "Review your recording before submitting.";
        };
    }

    fileUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        if (file.size > 10485760) {
            statusText.innerText = "Error: File is larger than the 10MB limit.";
            statusText.style.color = "red";
            fileUpload.value = "";
            return;
        }

        finalMimeType = file.type || 'audio/mp3'; 
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = () => {
            finalPayloadData = reader.result;
            audioPlayback.src = finalPayloadData;
            actionArea.style.display = 'none';
            reviewArea.style.display = 'block';
            statusText.innerText = "Review your uploaded file before submitting.";
            statusText.style.color = "#00a8e1";
        };
    });

    discardBtn.addEventListener('click', resetUI);

    submitBtn.addEventListener('click', () => {
        if (!finalPayloadData) return;

        const userName = userNameInput.value.trim() || "Anonymous";
        const payload = {
            audioData: finalPayloadData,
            mimeType: finalMimeType,
            secretKey: hiddenSecretKey, 
            fileName: "CFP_Voicemail_" + userName.replace(/[^a-zA-Z0-9]/g, "_"),
            userNote: "Voicemail from: " + userName
        };

        submitBtn.disabled = true;
        discardBtn.disabled = true;
        statusText.innerText = "Sending your message...";

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); 

        fetch(webAppUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain' 
            },
            body: JSON.stringify(payload),
            signal: controller.signal
        })
        .then(response => response.json())
        .then(data => {
            clearTimeout(timeoutId);
            if (data.status === 'success') {
                statusText.innerText = "Voicemail submitted successfully!";
                statusText.style.color = "#00a8e1";
                userNameInput.value = "";
                localStorage.setItem('lastVoicemailTime', Date.now().toString());
                
                setTimeout(() => {
                    resetUI();
                }, 4000);
            } else {
                statusText.innerText = "Error: " + (data.message || "Upload failed.");
                statusText.style.color = "red";
            }
        })
        .catch(err => {
            clearTimeout(timeoutId);
            statusText.innerText = "Error uploading file. Please try again.";
            statusText.style.color = "red";
            console.error("Upload error:", err);
        })
        .finally(() => {
            submitBtn.disabled = false;
            discardBtn.disabled = false;
        });
    });
</script>
</body>
</html>
